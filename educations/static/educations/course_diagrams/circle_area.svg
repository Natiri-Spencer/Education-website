<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Area fills the interior</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><circle cx="380" cy="150" r="90" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><line x1="380" y1="150" x2="470" y2="150" stroke="#bc5c16" stroke-width="3" /><text x="425" y="135" font-size="18" fill="#172e48" text-anchor="middle">7 cm</text><circle cx="380" cy="150" r="3" fill="#172e48" stroke="#087b74" stroke-width="3"/><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">Area = πr² = 154 cm²  (π = 22/7)</text></g></svg>
