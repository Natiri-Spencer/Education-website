<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Circular base times height</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><path d="M290 90 V235 A90 25 0 0 0 470 235 V90" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><ellipse cx="380" cy="90" rx="90" ry="25" fill="#eef8dc" stroke="#087b74" stroke-width="3"/><line x1="380" y1="90" x2="470" y2="90" stroke="#bc5c16" stroke-width="3" /><text x="425" y="78" font-size="18" fill="#172e48" text-anchor="middle">7 cm</text><line x1="510" y1="90" x2="510" y2="235" stroke="#172e48" stroke-width="3" /><text x="560" y="170" font-size="22" fill="#172e48" text-anchor="middle">10 cm</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">V = π × 7² × 10 = 1540 cm³  (π = 22/7)</text></g></svg>
