<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Average speed = total distance ÷ total time</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><line x1="100" y1="170" x2="660" y2="170" stroke="#172e48" stroke-width="3" /><circle cx="100" cy="170" r="7" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="100" y="145" font-size="18" fill="#172e48" text-anchor="middle">0 km</text><text x="100" y="210" font-size="18" fill="#172e48" text-anchor="middle">0 h</text><circle cx="285" cy="170" r="7" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="285" y="145" font-size="18" fill="#172e48" text-anchor="middle">60 km</text><text x="285" y="210" font-size="18" fill="#172e48" text-anchor="middle">1 h</text><circle cx="470" cy="170" r="7" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="470" y="145" font-size="18" fill="#172e48" text-anchor="middle">120 km</text><text x="470" y="210" font-size="18" fill="#172e48" text-anchor="middle">2 h</text><circle cx="655" cy="170" r="7" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="655" y="145" font-size="18" fill="#172e48" text-anchor="middle">180 km</text><text x="655" y="210" font-size="18" fill="#172e48" text-anchor="middle">3 h</text><text x="380" y="260" font-size="19" fill="#172e48" text-anchor="middle">Equal sections illustrate constant speed.</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">180 km ÷ 3 h = 60 km/h ≈ 16.67 m/s</text></g></svg>
