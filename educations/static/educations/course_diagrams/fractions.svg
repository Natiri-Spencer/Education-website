<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Equal parts, equivalent values</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="180" y="80" width="100" height="100" fill="#8dd7c3" stroke="#087b74" stroke-width="3"/><rect x="280" y="80" width="100" height="100" fill="#8dd7c3" stroke="#087b74" stroke-width="3"/><rect x="380" y="80" width="100" height="100" fill="white" stroke="#087b74" stroke-width="3"/><rect x="480" y="80" width="100" height="100" fill="white" stroke="#087b74" stroke-width="3"/><text x="380" y="238" font-size="22" fill="#172e48" text-anchor="middle">2 of 4 equal parts shaded</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">2/4 = 1/2 = 0.5 = 50%</text></g></svg>
