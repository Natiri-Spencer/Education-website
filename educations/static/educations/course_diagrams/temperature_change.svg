<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Do not add an offset to a change</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="100" y="70" width="210" height="75" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="205" y="115.5" font-size="22" fill="#172e48" text-anchor="middle">18 °C</text><text x="380" y="119" font-size="22" fill="#172e48" text-anchor="middle">→</text><rect x="450" y="70" width="210" height="75" fill="#eef8dc" stroke="#087b74" stroke-width="3"/><text x="555" y="115.5" font-size="22" fill="#172e48" text-anchor="middle">27 °C</text><text x="380" y="201" font-size="22" fill="#172e48" text-anchor="middle">27 − 18 = 9 °C rise</text><text x="380" y="245" font-size="22" fill="#172e48" text-anchor="middle">The same rise is 9 K.</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">Changes use equal-sized steps on both scales.</text></g></svg>
