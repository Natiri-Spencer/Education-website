<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Convert length units</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="45" y="85" width="130" height="80" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="110" y="133" font-size="22" fill="#172e48" text-anchor="middle">km</text><text x="215" y="135" font-size="18" fill="#172e48" text-anchor="middle">×1000</text><rect x="260" y="85" width="100" height="80" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="310" y="133" font-size="22" fill="#172e48" text-anchor="middle">m</text><text x="401" y="135" font-size="18" fill="#172e48" text-anchor="middle">×100</text><rect x="445" y="85" width="100" height="80" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="495" y="133" font-size="22" fill="#172e48" text-anchor="middle">cm</text><text x="585" y="135" font-size="18" fill="#172e48" text-anchor="middle">×10</text><rect x="630" y="85" width="90" height="80" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="675" y="133" font-size="22" fill="#172e48" text-anchor="middle">mm</text><text x="380" y="220" font-size="22" fill="#172e48" text-anchor="middle">Multiply → smaller units</text><text x="380" y="255" font-size="22" fill="#172e48" text-anchor="middle">Divide ← larger units</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">2.35 m = 235 cm = 2350 mm</text></g></svg>
