<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Radius and diameter</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><circle cx="380" cy="150" r="90" fill="white" stroke="#087b74" stroke-width="3"/><line x1="290" y1="150" x2="470" y2="150" stroke="#172e48" stroke-width="3" /><circle cx="380" cy="150" r="3" fill="#172e48" stroke="#087b74" stroke-width="3"/><line x1="380" y1="150" x2="380" y2="60" stroke="#bc5c16" stroke-width="3" /><text x="430" y="113" font-size="18" fill="#172e48" text-anchor="middle">r = 7 cm</text><text x="380" y="183" font-size="18" fill="#172e48" text-anchor="middle">d = 14 cm</text><text x="380" y="273" font-size="20" fill="#172e48" text-anchor="middle">Circumference follows the outside curve.</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">C = πd = 44 cm  (π = 22/7)</text></g></svg>
