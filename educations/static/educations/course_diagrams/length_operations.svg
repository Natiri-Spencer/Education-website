<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Use a common unit</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="80" y="65" width="275" height="55" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="217.5" y="100.5" font-size="22" fill="#172e48" text-anchor="middle">275 cm</text><rect x="355" y="65" width="160" height="55" fill="#eef8dc" stroke="#087b74" stroke-width="3"/><text x="435" y="100.5" font-size="22" fill="#172e48" text-anchor="middle">160 cm</text><text x="300" y="155" font-size="22" fill="#172e48" text-anchor="middle">275 + 160 = 435 cm = 4 m 35 cm</text><rect x="100" y="205" width="131" height="55" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="165.5" y="240.5" font-size="22" fill="#172e48" text-anchor="middle">131 cm</text><rect x="231" y="205" width="131" height="55" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="296.5" y="240.5" font-size="22" fill="#172e48" text-anchor="middle">131 cm</text><rect x="362" y="205" width="131" height="55" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="427.5" y="240.5" font-size="22" fill="#172e48" text-anchor="middle">131 cm</text><rect x="493" y="205" width="131" height="55" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="558.5" y="240.5" font-size="22" fill="#172e48" text-anchor="middle">131 cm</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">524 cm ÷ 4 = 131 cm each</text></g></svg>
