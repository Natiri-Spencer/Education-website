<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Areas of the squares</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="280" y="120" width="60" height="60" fill="#eef8dc" stroke="#087b74" stroke-width="3"/><rect x="340" y="180" width="80" height="80" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><polygon points="420,180 340,120 400,40 480,100" fill="#d8e9ff" stroke="#087b74" stroke-width="3"/><polygon points="340,180 420,180 340,120" fill="white" stroke="#087b74" stroke-width="3"/><text x="310" y="157" font-size="22" fill="#172e48" text-anchor="middle">9</text><text x="380" y="228" font-size="22" fill="#172e48" text-anchor="middle">16</text><text x="413" y="113" font-size="22" fill="#172e48" text-anchor="middle">25</text><text x="380" y="293" font-size="20" fill="#172e48" text-anchor="middle">Areas in cm²; triangle sides are 3, 4 and 5 cm.</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">3² + 4² = 5²    →    9 + 16 = 25</text></g></svg>
