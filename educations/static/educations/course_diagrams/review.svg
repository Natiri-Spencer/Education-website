<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Same dimensions, different questions</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="260" y="65" width="240" height="150" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="380" y="47" font-size="22" fill="#172e48" text-anchor="middle">2.4 m</text><text x="555" y="145" font-size="20" fill="#172e48" text-anchor="middle">150 cm</text><text x="380" y="155" font-size="20" fill="#172e48" text-anchor="middle">150 cm = 1.5 m</text><text x="380" y="271" font-size="22" fill="#172e48" text-anchor="middle">Perimeter = 7.8 m</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">Area = 2.4 × 1.5 = 3.6 m²</text></g></svg>
