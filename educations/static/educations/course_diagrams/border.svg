<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Subtract the inner area</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="224" y="40" width="312" height="208" fill="#eef8dc" stroke="#087b74" stroke-width="3"/><rect x="250" y="66" width="260" height="156" fill="white" stroke="#087b74" stroke-width="3"/><text x="380" y="30" font-size="22" fill="#172e48" text-anchor="middle">12 m outside</text><text x="590" y="150" font-size="20" fill="#172e48" text-anchor="middle">8 m</text><text x="380" y="140" font-size="22" fill="#172e48" text-anchor="middle">10 m × 6 m</text><text x="380" y="192" font-size="18" fill="#172e48" text-anchor="middle">garden</text><text x="380" y="277" font-size="20" fill="#172e48" text-anchor="middle">Path width = 1 m on every side</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">Path area = 12 × 8 − 10 × 6 = 36 m²</text></g></svg>
