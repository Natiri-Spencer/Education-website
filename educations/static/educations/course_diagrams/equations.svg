<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Keep both sides equal</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="100" y="50" width="210" height="70" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="205" y="93" font-size="22" fill="#172e48" text-anchor="middle">2x + 4</text><text x="380" y="97" font-size="22" fill="#172e48" text-anchor="middle">=</text><rect x="450" y="50" width="210" height="70" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="555" y="93" font-size="22" fill="#172e48" text-anchor="middle">12</text><text x="200" y="160" font-size="22" fill="#172e48" text-anchor="middle">subtract 4</text><text x="555" y="160" font-size="22" fill="#172e48" text-anchor="middle">subtract 4</text><rect x="100" y="185" width="210" height="65" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="205" y="225.5" font-size="22" fill="#172e48" text-anchor="middle">2x</text><text x="380" y="230" font-size="22" fill="#172e48" text-anchor="middle">=</text><rect x="450" y="185" width="210" height="65" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="555" y="225.5" font-size="22" fill="#172e48" text-anchor="middle">8</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">Divide both sides by 2: x = 4</text></g></svg>
