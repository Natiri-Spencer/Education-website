<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Full capacity versus water now</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="245" y="55" width="240" height="180" fill="white" stroke="#087b74" stroke-width="3"/><rect x="245" y="127" width="240" height="108" fill="#bbdcff" stroke="#087b74" stroke-width="3"/><text x="365" y="42" font-size="22" fill="#172e48" text-anchor="middle">inside length 40 cm</text><text x="560" y="140" font-size="18" fill="#172e48" text-anchor="middle">height 30 cm</text><text x="365" y="175" font-size="18" fill="#172e48" text-anchor="middle">water depth 18 cm</text><text x="365" y="212" font-size="17" fill="#172e48" text-anchor="middle">width into page: 25 cm</text><text x="380" y="275" font-size="22" fill="#172e48" text-anchor="middle">Full tank: 30 L · Water now: 18 L</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">1000 cm³ = 1 litre</text></g></svg>
