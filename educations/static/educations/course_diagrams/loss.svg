<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Selling price below cost price</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="100" y="90" width="420" height="80" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="310" y="138" font-size="22" fill="#172e48" text-anchor="middle">Selling price: KES 2100</text><rect x="520" y="90" width="60" height="80" fill="#ffe4d4" stroke="#087b74" stroke-width="3"/><text x="550" y="138" font-size="22" fill="#172e48" text-anchor="middle">300</text><text x="550" y="215" font-size="22" fill="#172e48" text-anchor="middle">loss</text><text x="360" y="258" font-size="22" fill="#172e48" text-anchor="middle">Cost price: KES 2400</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">Loss = 2400 − 2100 = KES 300</text></g></svg>
