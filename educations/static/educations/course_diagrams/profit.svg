<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Selling price above cost price</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="190" y="90" width="320" height="80" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="350" y="138" font-size="22" fill="#172e48" text-anchor="middle">Cost: KES 800</text><rect x="510" y="90" width="60" height="80" fill="#eef8dc" stroke="#087b74" stroke-width="3"/><text x="540" y="205" font-size="18" fill="#172e48" text-anchor="middle">KES 150</text><text x="540" y="235" font-size="18" fill="#172e48" text-anchor="middle">profit</text><text x="380" y="275" font-size="22" fill="#172e48" text-anchor="middle">Selling price: KES 950</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">Profit = 950 − 800 = KES 150</text></g></svg>
