<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Use one unit before adding</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="90" y="80" width="350" height="70" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="265" y="123" font-size="22" fill="#172e48" text-anchor="middle">2 km = 2000 m</text><text x="477" y="125" font-size="22" fill="#172e48" text-anchor="middle">+</text><rect x="515" y="80" width="150" height="70" fill="#eef8dc" stroke="#087b74" stroke-width="3"/><text x="590" y="123" font-size="22" fill="#172e48" text-anchor="middle">75 m</text><text x="380" y="220" font-size="22" fill="#172e48" text-anchor="middle">2000 m + 75 m = 2075 m</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">2075 m ÷ 1000 = 2.075 km</text></g></svg>
