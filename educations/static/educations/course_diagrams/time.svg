<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Convert in steps of 60</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="55" y="90" width="170" height="85" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="140" y="140.5" font-size="22" fill="#172e48" text-anchor="middle">hours</text><text x="270" y="142" font-size="20" fill="#172e48" text-anchor="middle">×60</text><rect x="320" y="90" width="140" height="85" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="390" y="140.5" font-size="22" fill="#172e48" text-anchor="middle">minutes</text><text x="505" y="142" font-size="20" fill="#172e48" text-anchor="middle">×60</text><rect x="550" y="90" width="160" height="85" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="630" y="140.5" font-size="22" fill="#172e48" text-anchor="middle">seconds</text><text x="380" y="225" font-size="22" fill="#172e48" text-anchor="middle">Reverse direction: ÷60 at each step</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">0.5 hour = 30 minutes = 1800 seconds</text></g></svg>
