<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Digits show place value</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="100" y="70" width="170" height="100" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="185" y="128" font-size="22" fill="#172e48" text-anchor="middle">2</text><rect x="295" y="70" width="170" height="100" fill="#eef8dc" stroke="#087b74" stroke-width="3"/><text x="380" y="128" font-size="22" fill="#172e48" text-anchor="middle">3</text><rect x="490" y="70" width="170" height="100" fill="#d8e9ff" stroke="#087b74" stroke-width="3"/><text x="575" y="128" font-size="22" fill="#172e48" text-anchor="middle">5</text><text x="185" y="215" font-size="22" fill="#172e48" text-anchor="middle">ones</text><text x="380" y="215" font-size="22" fill="#172e48" text-anchor="middle">tenths</text><text x="575" y="215" font-size="22" fill="#172e48" text-anchor="middle">hundredths</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">2.35 = 2 + 3/10 + 5/100</text></g></svg>
