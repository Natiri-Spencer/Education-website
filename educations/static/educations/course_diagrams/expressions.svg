<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Read an expression</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="140" y="75" width="155" height="95" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="217.5" y="130.5" font-size="22" fill="#172e48" text-anchor="middle">3x</text><text x="322" y="136" font-size="22" fill="#172e48" text-anchor="middle">+</text><rect x="350" y="75" width="120" height="95" fill="#eef8dc" stroke="#087b74" stroke-width="3"/><text x="410" y="130.5" font-size="22" fill="#172e48" text-anchor="middle">2</text><text x="210" y="210" font-size="22" fill="#172e48" text-anchor="middle">3: coefficient</text><text x="210" y="242" font-size="22" fill="#172e48" text-anchor="middle">x: variable</text><text x="410" y="210" font-size="22" fill="#172e48" text-anchor="middle">2: constant</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">When x = 4: 3 × 4 + 2 = 14</text></g></svg>
