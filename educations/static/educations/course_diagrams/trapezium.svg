<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Use the parallel sides</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><polygon points="240,210 520,210 460,110 300,110" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="380" y="89" font-size="22" fill="#172e48" text-anchor="middle">8 cm</text><text x="380" y="246" font-size="22" fill="#172e48" text-anchor="middle">14 cm</text><line x1="300" y1="110" x2="300" y2="210" stroke="#bc5c16" stroke-width="3" stroke-dasharray="6 4"/><text x="350" y="166" font-size="18" fill="#172e48" text-anchor="middle">5 cm</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">Area = ½ × (8 + 14) × 5 = 55 cm²</text></g></svg>
