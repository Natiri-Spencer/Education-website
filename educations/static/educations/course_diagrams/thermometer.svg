<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Read the scale and unit</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="340" y="45" width="35" height="200" fill="white" stroke="#087b74" stroke-width="3"/><rect x="348" y="120" width="19" height="125" fill="#d46c38" stroke="#087b74" stroke-width="3"/><circle cx="357" cy="245" r="24" fill="#d46c38" stroke="#087b74" stroke-width="3"/><line x1="380" y1="245" x2="395" y2="245" stroke="#172e48" stroke-width="3" /><text x="428" y="251" font-size="18" fill="#172e48" text-anchor="middle">0 °C</text><line x1="380" y1="220" x2="395" y2="220" stroke="#172e48" stroke-width="3" /><text x="428" y="226" font-size="18" fill="#172e48" text-anchor="middle">5 °C</text><line x1="380" y1="195" x2="395" y2="195" stroke="#172e48" stroke-width="3" /><text x="428" y="201" font-size="18" fill="#172e48" text-anchor="middle">10 °C</text><line x1="380" y1="170" x2="395" y2="170" stroke="#172e48" stroke-width="3" /><text x="428" y="176" font-size="18" fill="#172e48" text-anchor="middle">15 °C</text><line x1="380" y1="145" x2="395" y2="145" stroke="#172e48" stroke-width="3" /><text x="428" y="151" font-size="18" fill="#172e48" text-anchor="middle">20 °C</text><line x1="380" y1="120" x2="395" y2="120" stroke="#172e48" stroke-width="3" /><text x="428" y="126" font-size="18" fill="#172e48" text-anchor="middle">25 °C</text><line x1="380" y1="95" x2="395" y2="95" stroke="#172e48" stroke-width="3" /><text x="428" y="101" font-size="18" fill="#172e48" text-anchor="middle">30 °C</text><line x1="380" y1="70" x2="395" y2="70" stroke="#172e48" stroke-width="3" /><text x="428" y="76" font-size="18" fill="#172e48" text-anchor="middle">35 °C</text><line x1="380" y1="45" x2="395" y2="45" stroke="#172e48" stroke-width="3" /><text x="428" y="51" font-size="18" fill="#172e48" text-anchor="middle">40 °C</text><text x="220" y="129" font-size="22" fill="#172e48" text-anchor="middle">25 °C</text><line x1="260" y1="123" x2="340" y2="123" stroke="#bc5c16" stroke-width="3" /><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">Each marked interval is 5 °C.</text></g></svg>
