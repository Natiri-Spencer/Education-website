<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Between two boundaries</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><text x="380" y="65" font-size="22" fill="#172e48" text-anchor="middle">−2 ≤ x &lt; 4</text><line x1="105" y1="165" x2="635" y2="165" stroke="#172e48" stroke-width="3" /><line x1="130" y1="159" x2="130" y2="171" stroke="#172e48" stroke-width="3" /><text x="130" y="195" font-size="18" fill="#172e48" text-anchor="middle">-4</text><line x1="178" y1="159" x2="178" y2="171" stroke="#172e48" stroke-width="3" /><text x="178" y="195" font-size="18" fill="#172e48" text-anchor="middle">-3</text><line x1="226" y1="159" x2="226" y2="171" stroke="#172e48" stroke-width="3" /><text x="226" y="195" font-size="18" fill="#172e48" text-anchor="middle">-2</text><line x1="274" y1="159" x2="274" y2="171" stroke="#172e48" stroke-width="3" /><text x="274" y="195" font-size="18" fill="#172e48" text-anchor="middle">-1</text><line x1="322" y1="159" x2="322" y2="171" stroke="#172e48" stroke-width="3" /><text x="322" y="195" font-size="18" fill="#172e48" text-anchor="middle">0</text><line x1="370" y1="159" x2="370" y2="171" stroke="#172e48" stroke-width="3" /><text x="370" y="195" font-size="18" fill="#172e48" text-anchor="middle">1</text><line x1="418" y1="159" x2="418" y2="171" stroke="#172e48" stroke-width="3" /><text x="418" y="195" font-size="18" fill="#172e48" text-anchor="middle">2</text><line x1="466" y1="159" x2="466" y2="171" stroke="#172e48" stroke-width="3" /><text x="466" y="195" font-size="18" fill="#172e48" text-anchor="middle">3</text><line x1="514" y1="159" x2="514" y2="171" stroke="#172e48" stroke-width="3" /><text x="514" y="195" font-size="18" fill="#172e48" text-anchor="middle">4</text><line x1="562" y1="159" x2="562" y2="171" stroke="#172e48" stroke-width="3" /><text x="562" y="195" font-size="18" fill="#172e48" text-anchor="middle">5</text><line x1="610" y1="159" x2="610" y2="171" stroke="#172e48" stroke-width="3" /><text x="610" y="195" font-size="18" fill="#172e48" text-anchor="middle">6</text><line x1="226" y1="165" x2="514" y2="165" stroke="#087b74" stroke-width="3" /><circle cx="226" cy="165" r="9" fill="#087b74" stroke="#087b74" stroke-width="3"/><circle cx="514" cy="165" r="9" fill="white" stroke="#087b74" stroke-width="3"/><text x="226" y="248" font-size="22" fill="#172e48" text-anchor="middle">include −2</text><text x="514" y="248" font-size="22" fill="#172e48" text-anchor="middle">exclude 4</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">Every value in between is included.</text></g></svg>
