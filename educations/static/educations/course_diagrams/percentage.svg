<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Identify the percentage base</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="130" y="80" width="100" height="75" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="180" y="125.5" font-size="22" fill="#172e48" text-anchor="middle">100</text><rect x="230" y="80" width="100" height="75" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="280" y="125.5" font-size="22" fill="#172e48" text-anchor="middle">100</text><rect x="330" y="80" width="100" height="75" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="380" y="125.5" font-size="22" fill="#172e48" text-anchor="middle">100</text><rect x="430" y="80" width="100" height="75" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="480" y="125.5" font-size="22" fill="#172e48" text-anchor="middle">100</text><rect x="530" y="80" width="100" height="75" fill="#eef8dc" stroke="#087b74" stroke-width="3"/><text x="580" y="125.5" font-size="22" fill="#172e48" text-anchor="middle">100</text><text x="380" y="197" font-size="22" fill="#172e48" text-anchor="middle">Cost price: KES 500 (five parts)</text><text x="380" y="241" font-size="22" fill="#172e48" text-anchor="middle">Profit: KES 100 (one part)</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">Percentage profit = 100 / 500 × 100% = 20%</text></g></svg>
