<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Reduce the marked price</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="100" y="80" width="440" height="85" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><text x="320" y="130.5" font-size="22" fill="#172e48" text-anchor="middle">Sale price: KES 2200</text><rect x="540" y="80" width="60" height="85" fill="#ffe4d4" stroke="#087b74" stroke-width="3"/><text x="590" y="204" font-size="18" fill="#172e48" text-anchor="middle">KES 300</text><text x="590" y="235" font-size="18" fill="#172e48" text-anchor="middle">discount</text><text x="350" y="270" font-size="22" fill="#172e48" text-anchor="middle">Marked price: KES 2500</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">12% of 2500 = 300; pay 2500 − 300</text></g></svg>
