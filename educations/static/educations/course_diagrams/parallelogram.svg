<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Height is perpendicular to the base</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><polygon points="195,215 495,215 565,90 265,90" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><line x1="265" y1="90" x2="265" y2="215" stroke="#bc5c16" stroke-width="3" stroke-dasharray="6 4"/><line x1="265" y1="198" x2="282" y2="198" stroke="#bc5c16" stroke-width="3" /><line x1="282" y1="198" x2="282" y2="215" stroke="#bc5c16" stroke-width="3" /><text x="345" y="254" font-size="22" fill="#172e48" text-anchor="middle">base = 12 cm</text><text x="360" y="157" font-size="20" fill="#172e48" text-anchor="middle">height = 5 cm</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">Area = base × height = 60 cm²</text></g></svg>
