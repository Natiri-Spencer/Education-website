<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Count square units</title><rect width="760" height="360" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="260" y="65" width="240" height="150" fill="#d9f4ee" stroke="#087b74" stroke-width="3"/><line x1="290" y1="65" x2="290" y2="215" stroke="#8bbdb4" stroke-width="3" /><line x1="320" y1="65" x2="320" y2="215" stroke="#8bbdb4" stroke-width="3" /><line x1="350" y1="65" x2="350" y2="215" stroke="#8bbdb4" stroke-width="3" /><line x1="380" y1="65" x2="380" y2="215" stroke="#8bbdb4" stroke-width="3" /><line x1="410" y1="65" x2="410" y2="215" stroke="#8bbdb4" stroke-width="3" /><line x1="440" y1="65" x2="440" y2="215" stroke="#8bbdb4" stroke-width="3" /><line x1="470" y1="65" x2="470" y2="215" stroke="#8bbdb4" stroke-width="3" /><line x1="260" y1="95" x2="500" y2="95" stroke="#8bbdb4" stroke-width="3" /><line x1="260" y1="125" x2="500" y2="125" stroke="#8bbdb4" stroke-width="3" /><line x1="260" y1="155" x2="500" y2="155" stroke="#8bbdb4" stroke-width="3" /><line x1="260" y1="185" x2="500" y2="185" stroke="#8bbdb4" stroke-width="3" /><text x="380" y="47" font-size="22" fill="#172e48" text-anchor="middle">8 cm</text><text x="215" y="150" font-size="22" fill="#172e48" text-anchor="middle">5 cm</text><text x="380" y="269" font-size="20" fill="#172e48" text-anchor="middle">8 columns × 5 rows</text><text x="380" y="322" font-size="24" fill="#172e48" text-anchor="middle">Area = 8 × 5 = 40 cm²</text></g></svg>
