<section id="capacity-workspace" class="geometry-workspace vc-workspace" hidden aria-label="Volume and Capacity experiment">
 <header class="geo-header"><strong>VOLUME AND CAPACITY | GRADE 7</strong><div><button id="vc-fullscreen" type="button">Full screen</button><button id="vc-close" type="button" aria-label="Close Volume and Capacity">&#10005;</button></div></header>
 <div class="vc-heading"><h2 id="vc-title">Rectangular Prisms — Volume</h2><label for="vc-activity" class="sr-only">Activity</label><select id="vc-activity"><option value="cuboids">Calculating volume of cubes and cuboids</option><option value="cylinders">Calculating volume of cylinders</option><option value="fixed">Volume of fixed measurement</option><option value="converting">Converting between units</option><option value="units">Understanding units of measurement</option><option value="relationship">Relationship between volume and capacity</option></select></div>
 <div class="vc-layout">
  <aside class="vc-panel vc-procedure"><h2>&#128214; STEPS</h2><ol id="vc-steps"></ol><p id="vc-hint"></p></aside>
  <main class="vc-model"><div class="vc-tools"><button id="vc-magnify" type="button">Magnify</button><button id="vc-measure-l" type="button">Measure length</button><button id="vc-measure-w" type="button">Measure width</button><button id="vc-measure-h" type="button">Measure height</button></div>
   <div id="vc-dimensions" class="vc-dimensions"><label id="vc-shape-label">Solid<select id="vc-shape"><option value="cuboid">Cuboid</option><option value="cube">Cube</option></select></label><label id="vc-length-label"><span id="vc-length-name">Length</span><input id="vc-length" type="range" min="2" max="10" value="8"><output id="vc-length-display">?</output></label><label id="vc-width-label">Width<input id="vc-width" type="range" min="2" max="7" value="5"><output id="vc-width-display">?</output></label><label id="vc-height-label">Height<input id="vc-height" type="range" min="2" max="6" value="3"><output id="vc-height-display">?</output></label><label id="vc-fill-label" hidden>Water level<input id="vc-fill" type="range" min="0" max="100" value="50"><output id="vc-fill-display">50%</output></label></div>
   <svg id="vc-drawing" viewBox="0 0 1000 650" role="group" aria-label="Solid and measuring ruler"></svg><p id="vc-observation" role="status" aria-live="polite"></p>
  </main>
  <aside class="vc-panel vc-answers"><small>FORMULA</small><h3 id="vc-formula">Volume = L × W × H</h3><div id="vc-inputs"></div><button id="vc-calculator" type="button">Calculator</button><div id="vc-calculator-panel" hidden><label for="vc-expression">Calculation (use × or *, ÷ or /)</label><input id="vc-expression" placeholder="8 × 5 × 3"><button id="vc-calculate" type="button">Calculate</button><output id="vc-calculator-result" aria-live="polite"></output></div><button id="vc-verify" type="button">Verify &amp; record</button><p id="vc-feedback" role="status" aria-live="polite"></p><button id="vc-new" type="button">New example</button></aside>
 </div>
