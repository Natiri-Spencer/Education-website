{% extends "educations/base.xhtml" %}

{% block title %}{{ grade.name }} Resources{% endblock %}

{% block content %}
    <h1 class="mb-4 text-primary">{{ grade.name }} - Subjects</h1>
    <div class="list-group">
        {% for subject in subjects %}
            <a href="{% url 'educations:subject_resources' subject.id %}" class="list-group-item list-group-item-action">
                {{ subject.name }}
            </a>
        {% empty %}
            <div class="alert alert-warning">No subjects available for this grade.</div>
        {% endfor %}
    </div>
{% endblock %}
