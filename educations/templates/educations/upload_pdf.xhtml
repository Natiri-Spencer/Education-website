{% extends "educations/base.xhtml" %}

{% block title %}Add a PDF | CBE STEM ACADEMY{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7 col-md-9">
    <h1 class="mb-3">Add a PDF resource</h1>
    <p class="text-muted">Choose the subject, give the resource a title, and select a PDF file.</p>
    <form method="post" enctype="multipart/form-data" class="card card-body shadow-sm">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Upload PDF</button>
        <a href="{% url 'educations:pdf_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
