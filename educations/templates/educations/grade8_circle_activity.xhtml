<aside id="g8-circle-procedure" class="g8-circle-procedure" hidden><header><h2>PROCEDURE</h2><button type="button" id="g8-circle-tutorial-button">Tutorial</button></header><div id="g8-circle-stage-list"></div></aside>
<aside id="g8-circle-calculations" class="g8-circle-calculations" hidden><h2>Calculation Steps</h2><fieldset class="g8-pi"><legend>USE PI AS</legend><label><input type="radio" name="g8-circle-pi" value="fraction" checked>22/7</label><label><input type="radio" name="g8-circle-pi" value="decimal">3.142</label></fieldset>
<section id="g8-calc-circumference" class="g8-calc-card g8-calc-green"><h3>CIRCUMFERENCE OF A CIRCLE</h3><p>C = 2&#960;r</p><label class="sr-only" for="g8-circumference-radius">Radius in cm</label><input id="g8-circumference-radius" type="number" min="0.01" step="any" placeholder="Radius (cm)"><label class="sr-only" for="g8-circumference-work">Working</label><textarea id="g8-circumference-work" rows="2" placeholder="e.g. 2 x 22/7 x 3.5"></textarea><button type="button" id="g8-circumference-calculate" class="g8-calculate-button">Calculate</button><output id="g8-circumference-result" class="g8-calculation-result" aria-live="polite" hidden></output><div><label class="sr-only" for="g8-circumference-answer">Answer in cm</label><input id="g8-circumference-answer" type="number" step="any" placeholder="Answer"><button type="button" id="g8-circumference-check">Check</button></div><p id="g8-circumference-feedback" role="status"></p></section>
<section id="g8-calc-arc" class="g8-calc-card g8-calc-yellow"><h3>ARC LENGTH</h3><p>L = (&#952;/360) &times; 2&#960;r</p><div><label class="sr-only" for="g8-arc-radius">Radius in cm</label><input id="g8-arc-radius" type="number" min="0.01" step="any" placeholder="Radius (cm)"><label class="sr-only" for="g8-arc-angle">Angle in degrees</label><input id="g8-arc-angle" type="number" min="0.01" max="359.99" step="any" placeholder="Angle"></div><label class="sr-only" for="g8-arc-work">Working</label><textarea id="g8-arc-work" rows="2" placeholder="e.g. (90/360) x 2 x 22/7 x 3.5"></textarea><button type="button" id="g8-arc-calculate" class="g8-calculate-button">Calculate</button><output id="g8-arc-result" class="g8-calculation-result" aria-live="polite" hidden></output><div><label class="sr-only" for="g8-arc-answer">Answer in cm</label><input id="g8-arc-answer" type="number" step="any" placeholder="Answer"><button type="button" id="g8-arc-check">Check</button></div><p id="g8-arc-feedback" role="status"></p></section>
<section id="g8-calc-perimeter" class="g8-calc-card g8-calc-blue"><h3>PERIMETER OF A SECTOR</h3><p>P = 2r + (&#952;/360) &times; 2&#960;r</p><div><label class="sr-only" for="g8-perimeter-radius">Radius in cm</label><input id="g8-perimeter-radius" type="number" min="0.01" step="any" placeholder="Radius (cm)"><label class="sr-only" for="g8-perimeter-angle">Angle in degrees</label><input id="g8-perimeter-angle" type="number" min="0.01" max="359.99" step="any" placeholder="Angle"></div><label class="sr-only" for="g8-perimeter-work">Working</label><textarea id="g8-perimeter-work" rows="2" placeholder="e.g. 2 x 3.5 + arc length"></textarea><button type="button" id="g8-perimeter-calculate" class="g8-calculate-button">Calculate</button><output id="g8-perimeter-result" class="g8-calculation-result" aria-live="polite" hidden></output><div><label class="sr-only" for="g8-perimeter-answer">Answer in cm</label><input id="g8-perimeter-answer" type="number" step="any" placeholder="Answer"><button type="button" id="g8-perimeter-check">Check</button></div><p id="g8-perimeter-feedback" role="status"></p></section></aside>
